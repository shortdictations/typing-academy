<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — TypeShala</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<header class="letterhead">
  <div class="letterhead-inner">
    <a class="brand" href="index.html">
      <span class="seal">TS</span>
      <span class="brand-text">
        <span class="title">TypeShala</span>
        <span class="subtitle">Typing Practice Centre</span>
      </span>
    </a>
  </div>
</header>

<main class="page page-narrow">

  <div class="card">
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <!-- STEP 1: CHOICE — default view, no fields at all -->
    <div id="viewChoice">
      <h1 style="font-size:1.6rem; margin-bottom:20px;">Create Account</h1>
      <button type="button" class="auth-choice-btn" id="googleLoginBtn" style="margin-bottom:12px;">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="flex:none;">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.87 2.69-6.64z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/>
          <path fill="#FBBC05" d="M3.96 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96A8.996 8.996 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3-2.34z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3 2.34C4.67 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        <span>Continue with Google</span>
      </button>
      <button type="button" class="auth-choice-btn primary" id="showEmailBtn">
        <span aria-hidden="true">&#9993;</span>
        <span>Continue with Email</span>
      </button>
    </div>

    <!-- STEP 2: SIGN IN — reached via "Continue with Email" -->
    <div id="viewSignIn" style="display:none;">
      <button type="button" class="auth-back-link" id="backToChoiceBtn">&larr; Back</button>
      <h1 style="font-size:1.5rem; margin-bottom:18px;">Sign in</h1>

      <form id="loginForm">
        <div class="input-icon-field">
          <span class="field-icon" aria-hidden="true">&#9993;</span>
          <input type="email" id="loginEmail" placeholder="Enter your mail id" required autocomplete="email">
        </div>
        <div class="input-icon-field">
          <span class="field-icon" aria-hidden="true">&#128274;</span>
          <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <p style="margin:-6px 0 16px; text-align:right;">
          <a href="forgot-password.html" style="font-size:0.82rem; color:var(--stamp); text-decoration:none;">Forgot Password?</a>
        </p>
        <button type="submit" class="btn btn-full" id="loginBtn">Sign In</button>
      </form>

      <p class="foot-link">
        New here? <a href="register.html">Sign up</a>
      </p>
    </div>
  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
function hideMessages() {
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('successMsg').style.display = 'none';
}
function showError(text) {
  const el = document.getElementById('errorMsg');
  el.textContent = text;
  el.style.display = 'block';
}

// Simple 2-view toggle — no page reload, no separate route.
document.getElementById('showEmailBtn').addEventListener('click', () => {
  hideMessages();
  document.getElementById('viewChoice').style.display = 'none';
  document.getElementById('viewSignIn').style.display = 'block';
});
document.getElementById('backToChoiceBtn').addEventListener('click', () => {
  hideMessages();
  document.getElementById('viewSignIn').style.display = 'none';
  document.getElementById('viewChoice').style.display = 'block';
});

// Handle Google OAuth login — reuses the same supabaseClient from
// js/supabase-config.js, no separate client created. Works for both
// an existing Google account (signs in) and a brand-new one (Supabase
// creates it automatically) — same call either way.
document.getElementById('googleLoginBtn').addEventListener('click', async () => {
  hideMessages();
  const btn = document.getElementById('googleLoginBtn');
  btn.disabled = true;
  btn.querySelector('span:last-child').textContent = 'Redirecting to Google...';

  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/dashboard.html' }
  });

  if (error) {
    showError(error.message || 'Could not start Google sign-in. Please try again.');
    btn.disabled = false;
    btn.querySelector('span:last-child').textContent = 'Continue with Google';
  }
  // On success, Supabase redirects the browser to Google immediately —
  // no further code runs here.
});

// Handle login — unchanged from before, same loginStudent() call
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideMessages();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    await loginStudent(email, password);
    window.location.href = 'dashboard.html';
  } catch (err) {
    showError(err.message || 'Login failed. Please check your details.');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});

// If this browser was just signed out because another device logged
// into the same account, forceSessionLogout() (auth.js) left a
// message here for exactly this page to show once. Read-and-clear so
// it never reappears on a later, unrelated visit to this page.
let tsHadSessionInvalidatedMessage = false;
(() => {
  const sessionMsg = sessionStorage.getItem(TS_SESSION_MESSAGE_KEY);
  if (sessionMsg) {
    sessionStorage.removeItem(TS_SESSION_MESSAGE_KEY);
    showError(sessionMsg);
    tsHadSessionInvalidatedMessage = true;
  }
})();

// If already logged in, skip straight to dashboard — but not right
// after showing the message above, since forceSessionLogout() always
// signs out before redirecting here anyway (so this wouldn't
// normally fire either way); this just avoids the message flashing
// and instantly disappearing in any edge case where it somehow did.
(async () => {
  if (tsHadSessionInvalidatedMessage) return;
  const user = await getCurrentUser();
  if (user) window.location.href = 'dashboard.html';
})();
</script>

</body>
</html>
