<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — TypeShala</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="letterhead">
  <div class="letterhead-inner">
    <a class="brand" href="index.html">
      <span class="seal">TS</span>
      <span class="brand-text">
        <span class="title">TypeShala</span>
        <span class="subtitle">Typing Practice Centre</span>
      </span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="register.html">Register</a>
    </nav>
  </div>
</header>

<main class="page page-narrow">

  <p class="eyebrow">Student Access</p>
  <h1>Login to your account</h1>

  <div class="card">
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="email">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <p style="margin:-8px 0 16px; text-align:right;">
        <a href="#" id="forgotToggle" style="font-size:0.82rem; color:var(--stamp); text-decoration:none;">Forgot Password?</a>
      </p>
      <button type="submit" class="btn btn-full" id="loginBtn">Login</button>
    </form>

    <!-- Forgot password mini-form, hidden until the link above is clicked -->
    <div id="forgotWrap" style="display:none; margin-top:18px; padding-top:18px; border-top:1px dashed var(--paper-line);">
      <div class="field">
        <label for="forgotEmail">Enter your registered email</label>
        <input type="email" id="forgotEmail" autocomplete="email">
      </div>
      <button type="button" class="btn btn-ghost btn-full" id="forgotBtn">Send Reset Link</button>
    </div>

    <p class="foot-link">
      New here? <a href="register.html">Create an account</a>
    </p>
  </div>

</main>

<footer class="site-foot">TypeShala — built for typing practice, not affiliated with SSC or any government body.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
function hideMessages() {
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('successMsg').style.display = 'none';
}
function showError(text) {
  const el = document.getElementById('errorMsg');
  el.textContent = text;
  el.style.display = 'block';
}

// Toggle the forgot-password mini-form
document.getElementById('forgotToggle').addEventListener('click', (e) => {
  e.preventDefault();
  hideMessages();
  const wrap = document.getElementById('forgotWrap');
  wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
});

// Handle "Send Reset Link"
document.getElementById('forgotBtn').addEventListener('click', async () => {
  hideMessages();
  const email = document.getElementById('forgotEmail').value.trim();
  if (!email) {
    showError('Please enter your email address first.');
    return;
  }

  const btn = document.getElementById('forgotBtn');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html'
    });
  } catch (err) {
    // Supabase rarely errors here even for unregistered emails (to avoid
    // leaking which emails exist) — fall through to the same generic
    // success message either way.
    console.error(err);
  }

  const successEl = document.getElementById('successMsg');
  successEl.textContent = 'If that email is registered, a password reset link has been sent. Please check your inbox.';
  successEl.style.display = 'block';
  btn.disabled = false;
  btn.textContent = 'Send Reset Link';
});

// Handle login
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideMessages();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  try {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    await loginStudent(email, password);
    // Requirement 3: after successful login, go to dashboard.html
    window.location.href = 'dashboard.html';
  } catch (err) {
    showError(err.message || 'Login failed. Please check your details.');
    btn.disabled = false;
    btn.textContent = 'Login';
  }
});

// If already logged in, skip straight to dashboard
(async () => {
  const user = await getCurrentUser();
  if (user) window.location.href = 'dashboard.html';
})();
</script>

</body>
</html>
