<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Register — TypeShala</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="letterhead">
  <div class="letterhead-inner">
    <a class="brand" href="index.html">
      <span class="seal">TS</span>
      <span class="brand-text">
        <span class="title">TypeShala</span>
        <span class="subtitle">Typing Practice Centre</span>
      </span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
    </nav>
  </div>
</header>

<main class="page page-narrow">

  <p class="eyebrow">Student Access</p>
  <h1 id="pageHeading">Login to your account</h1>

  <div class="card">
    <div class="tabs">
      <div class="tab active" id="loginTab" onclick="showTab('login')">Login</div>
      <div class="tab" id="registerTab" onclick="showTab('register')">Register</div>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="email">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-full" id="loginBtn">Login</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" style="display:none;">
      <div class="field">
        <label for="regName">Full name</label>
        <input type="text" id="regName" required autocomplete="name">
      </div>
      <div class="field">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" required autocomplete="email">
      </div>
      <div class="field">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-full" id="registerBtn">Create account</button>
    </form>

    <p class="foot-link" id="switchHint">
      New here? <a href="#" onclick="showTab('register'); return false;">Register instead</a>
    </p>
  </div>

</main>

<footer class="site-foot">TypeShala — built for typing practice, not affiliated with SSC or any government body.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
function showTab(which) {
  const isLogin = which === 'login';
  document.getElementById('loginTab').classList.toggle('active', isLogin);
  document.getElementById('registerTab').classList.toggle('active', !isLogin);
  document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
  document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
  document.getElementById('pageHeading').textContent = isLogin ? 'Login to your account' : 'Create your student account';
  document.getElementById('switchHint').innerHTML = isLogin
    ? 'New here? <a href="#" onclick="showTab(\'register\'); return false;">Register instead</a>'
    : 'Already registered? <a href="#" onclick="showTab(\'login\'); return false;">Login instead</a>';
  hideMessages();
}

function hideMessages() {
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('successMsg').style.display = 'none';
}

function showError(text) {
  const el = document.getElementById('errorMsg');
  el.textContent = text;
  el.style.display = 'block';
  document.getElementById('successMsg').style.display = 'none';
}

function showSuccess(text) {
  const el = document.getElementById('successMsg');
  el.textContent = text;
  el.style.display = 'block';
  document.getElementById('errorMsg').style.display = 'none';
}

// Handle login
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideMessages();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  try {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    await loginStudent(email, password);
    window.location.href = 'dashboard.html';
  } catch (err) {
    showError(err.message || 'Login failed. Please check your details.');
    btn.disabled = false;
    btn.textContent = 'Login';
  }
});

// Handle registration
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideMessages();
  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  btn.textContent = 'Creating account...';

  try {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    await registerStudent(name, email, password);
    showSuccess('Account created! You can now login using the Login tab (check your email if confirmation is required).');
    document.getElementById('registerForm').reset();
    btn.disabled = false;
    btn.textContent = 'Create account';
  } catch (err) {
    showError(err.message || 'Registration failed. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Create account';
  }
});

// If already logged in, skip straight to dashboard
(async () => {
  const user = await getCurrentUser();
  if (user) window.location.href = 'dashboard.html';
})();
</script>

</body>
</html>
