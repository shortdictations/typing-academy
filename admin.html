<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — TypeShala</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="letterhead">
  <div class="letterhead-inner">
    <a class="brand" href="dashboard.html">
      <span class="seal">TS</span>
      <span class="brand-text">
        <span class="title">TypeShala</span>
        <span class="subtitle">Admin Panel</span>
      </span>
    </a>
    <nav class="nav-links">
      <a href="admin-mock-tests.html">Mock Tests</a>
      <a href="admin-products.html">Subscription &amp; Credits</a>
      <div class="user-menu">
        <button class="user-menu-trigger" id="userMenuTrigger" type="button"><span id="userChip"></span> &#9662;</button>
        <div class="user-menu-dropdown" id="userMenuDropdown">
          <button id="logoutBtn" type="button">Logout</button>
        </div>
      </div>
    </nav>
  </div>
</header>

<main class="page">

  <p class="eyebrow">Admin Only</p>
  <h1>Manage Passages</h1>
  <p class="lede">Add, edit, or remove typing passages. Changes appear on the student typing page immediately.</p>

  <!-- ADD / EDIT FORM -->
  <div class="card">
    <div class="card-label" id="formLabel">Add a New Passage</div>
    <div class="error-msg" id="formError"></div>
    <div class="success-msg" id="formSuccess"></div>

    <form id="passageForm">
      <div class="field">
        <label for="pTitle">Title</label>
        <input type="text" id="pTitle" required>
      </div>

      <div class="field">
        <label for="pContent">Passage Content</label>
        <textarea id="pContent" rows="6" required style="width:100%;padding:10px 12px;border:1px solid var(--paper-line);border-radius:3px;font-family:var(--font-mono);font-size:0.95rem;"></textarea>
      </div>

      <div class="setup-grid">
        <div class="field">
          <label for="pType">Passage Type</label>
          <select id="pType">
            <option value="Mock Test">Mock Test</option>
            <option value="Credit Based Test">Credit Based Test</option>
          </select>
        </div>
        <div class="field">
          <label for="pCategory">Category</label>
          <select id="pCategory">
            <option value="SSC">SSC</option>
            <option value="Legal">Legal</option>
          </select>
        </div>
      </div>

      <div class="setup-grid">
        <div class="field">
          <label for="pDuration">Duration</label>
          <select id="pDuration">
            <option value="10" selected>10 minutes</option>
            <option value="15">15 minutes</option>
            <option value="20">20 minutes</option>
          </select>
        </div>
        <div class="field">
          <label for="pActive">Status</label>
          <select id="pActive">
            <option value="true" selected>Active (visible to students)</option>
            <option value="false">Inactive (hidden)</option>
          </select>
        </div>
      </div>

      <div style="display:flex; gap:10px;">
        <button type="submit" class="btn" id="submitBtn">Add Passage</button>
        <button type="button" class="btn btn-ghost" id="cancelEditBtn" style="display:none;">Cancel Edit</button>
      </div>
    </form>
  </div>

  <!-- LIST + FILTER -->
  <div class="card">
    <div class="card-label">All Passages</div>

    <div class="setup-grid" style="max-width:560px;">
      <div class="field">
        <label for="filterCategory">Filter by Category</label>
        <select id="filterCategory">
          <option value="all">All Categories</option>
          <option value="SSC">SSC</option>
          <option value="Legal">Legal</option>
        </select>
      </div>
      <div class="field">
        <label for="filterType">Filter by Type</label>
        <select id="filterType">
          <option value="all">All Types</option>
          <option value="Mock Test">Mock Test</option>
          <option value="Credit Based Test">Credit Based Test</option>
        </select>
      </div>
    </div>

    <div id="passageListBody">
      <div class="loading-strip">Loading passages...</div>
    </div>
  </div>

</main>

<footer class="site-foot">TypeShala Admin Panel</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
