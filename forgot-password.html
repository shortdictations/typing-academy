<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — TypeShala</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="letterhead">
  <div class="letterhead-inner">
    <a class="brand" href="index.html">
      <span class="seal">TS</span>
      <span class="brand-text">
        <span class="title">TypeShala</span>
        <span class="subtitle">Typing Practice Centre</span>
      </span>
    </a>
    <nav class="nav-links">
      <a href="login.html">Login</a>
    </nav>
  </div>
</header>

<main class="page page-narrow">

  <p class="eyebrow">Student Access</p>
  <h1>Forgot your password?</h1>
  <p class="lede">Enter your email address and we'll send you a password reset link.</p>

  <div class="card">
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="forgotForm">
      <div class="field">
        <label for="forgotEmail">Email address</label>
        <input type="email" id="forgotEmail" placeholder="student@example.com" autocomplete="email">
      </div>
      <button type="submit" class="btn btn-full" id="forgotBtn">Send Reset Link</button>
    </form>

    <p class="foot-link">
      Remember your password? <a href="login.html">Sign in</a>
    </p>
  </div>

</main>

<footer class="site-foot">TypeShala — built for typing practice, not affiliated with SSC or any government body.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
function hideMessages() {
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('successMsg').style.display = 'none';
}
function showError(text) {
  const el = document.getElementById('errorMsg');
  el.textContent = text;
  el.style.display = 'block';
}

document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideMessages();

  const email = document.getElementById('forgotEmail').value.trim();
  if (!email) {
    showError('Please enter your email address first.');
    return;
  }

  const btn = document.getElementById('forgotBtn');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html'
    });
    if (error) throw error;

    const successEl = document.getElementById('successMsg');
    successEl.textContent = 'Password reset link has been sent to your email.';
    successEl.style.display = 'block';
  } catch (err) {
    showError(err.message || 'Could not send the reset link. Please try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send Reset Link';
  }
});
</script>

</body>
</html>
