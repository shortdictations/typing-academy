<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="shortcut icon" href="/favicon.ico">
<title>Reset your password — TypeShala</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth-redesign.css?v=4">
</head>
<body class="auth-shell">
<div class="auth-page auth-simple-page">

  <a class="auth-brand" href="index.html" aria-label="TypeShala home">
    <span class="auth-brand-mark">TS</span>
    <span class="auth-brand-copy"><strong>TypeShala</strong><small>TYPING PRACTICE CENTRE</small></span>
  </a>

  <main class="auth-main auth-simple-main">
    <section class="auth-panel auth-simple-panel" aria-live="polite">
      <div class="auth-view">
        <div class="auth-heading">
          <h1>Welcome to TypeShala</h1>
          <p>Your practice. Your progress. Your success.</p>
        </div>

        <div class="auth-error-msg" id="errorMsg"></div>
        <div class="auth-success-msg" id="successMsg"></div>

        <form id="forgotForm" novalidate>
          <div class="auth-field">
            <label for="forgotEmail">Email</label>
            <input class="auth-input" type="email" id="forgotEmail" placeholder="Your email address" autocomplete="email" required>
          </div>

          <button type="submit" class="auth-primary auth-simple-submit" id="forgotBtn">
            <span>Send reset instructions</span>
          </button>
        </form>

        <p class="auth-bottom auth-simple-back">
          <a href="login.html" class="auth-back-inline">‹&nbsp; Back to sign in</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="auth-footer">
    By continuing, you agree to TypeShala's
    <a href="index.html#terms">Terms and Conditions</a> and
    <a href="index.html#privacy">Privacy Policy</a>.
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
const emailInput = document.getElementById('forgotEmail');
const form = document.getElementById('forgotForm');
const button = document.getElementById('forgotBtn');
const errorMsg = document.getElementById('errorMsg');
const successMsg = document.getElementById('successMsg');

function hideMessages() {
  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';
}

function showError(message) {
  errorMsg.textContent = message;
  errorMsg.style.display = 'block';
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  hideMessages();

  const email = emailInput.value.trim();
  if (!email) {
    showError('Please enter your email address.');
    emailInput.focus();
    return;
  }

  if (!emailInput.checkValidity()) {
    showError('Please enter a valid email address.');
    emailInput.focus();
    return;
  }

  button.disabled = true;
  button.querySelector('span').textContent = 'Sending...';

  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html'
    });

    if (error) throw error;

    successMsg.textContent = 'Reset instructions have been sent to your email.';
    successMsg.style.display = 'block';
  } catch (error) {
    showError(error?.message || 'Could not send the reset instructions. Please try again.');
  } finally {
    button.disabled = false;
    button.querySelector('span').textContent = 'Send reset instructions';
  }
});

emailInput.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') {
    event.preventDefault();
    form.requestSubmit();
  }
});

emailInput.focus();
</script>
</body>
</html>
