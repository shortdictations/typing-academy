<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — TypeShala</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="letterhead">
  <div class="letterhead-inner">
    <a class="brand" href="index.html">
      <span class="seal">TS</span>
      <span class="brand-text">
        <span class="title">TypeShala</span>
        <span class="subtitle">Typing Practice Centre</span>
      </span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </nav>
  </div>
</header>

<main class="page page-narrow">

  <p class="eyebrow">Student Access</p>
  <h1>Create your student account</h1>

  <div class="card">
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="registerForm">
      <div class="field">
        <label for="regName">Full name</label>
        <input type="text" id="regName" required autocomplete="name">
      </div>
      <div class="field">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" required autocomplete="email">
      </div>
      <div class="field">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-full" id="registerBtn">Create account</button>
    </form>

    <div style="display:flex; align-items:center; gap:10px; margin:18px 0;">
      <div style="flex:1; height:1px; background:var(--paper-line);"></div>
      <span style="font-size:0.72rem; color:var(--ink-soft); letter-spacing:0.06em; white-space:nowrap;">OR SIGN UP WITH</span>
      <div style="flex:1; height:1px; background:var(--paper-line);"></div>
    </div>

    <button type="button" class="btn btn-ghost btn-full" id="googleSignupBtn" style="display:flex; align-items:center; justify-content:center; gap:10px;">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="flex:none;">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.87 2.69-6.64z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/>
        <path fill="#FBBC05" d="M3.96 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.95H.96A8.996 8.996 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3-2.34z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3 2.34C4.67 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <p class="foot-link">
      Already registered? <a href="login.html">Sign in</a>
    </p>
  </div>

</main>

<footer class="site-foot">TypeShala — built for typing practice, not affiliated with SSC or any government body.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
function hideMessages() {
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('successMsg').style.display = 'none';
}
function showError(text) {
  const el = document.getElementById('errorMsg');
  el.textContent = text;
  el.style.display = 'block';
  document.getElementById('successMsg').style.display = 'none';
}
function showSuccess(text) {
  const el = document.getElementById('successMsg');
  el.textContent = text;
  el.style.display = 'block';
  document.getElementById('errorMsg').style.display = 'none';
}

// Handle registration
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideMessages();
  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  btn.textContent = 'Creating account...';

  try {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    await registerStudent(name, email, password);
    showSuccess('Account created! Redirecting you to login...');
    document.getElementById('registerForm').reset();
    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
  } catch (err) {
    showError(err.message || 'Registration failed. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Create account';
  }
});

// Handle Google sign-up — reuses the same supabaseClient from
// js/supabase-config.js (same one email/password registration
// above uses); no second client, no OAuth secrets in this code.
document.getElementById('googleSignupBtn').addEventListener('click', async () => {
  hideMessages();
  const btn = document.getElementById('googleSignupBtn');
  if (btn.disabled) return; // prevent double-click / multiple OAuth attempts
  btn.disabled = true;
  const label = btn.querySelector('span');
  const originalText = label.textContent;
  label.textContent = 'Connecting...';

  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/dashboard.html' }
  });

  if (error) {
    showError(error.message || 'Could not start Google sign-up. Please try again.');
    btn.disabled = false;
    label.textContent = originalText;
  }
  // On success, Supabase redirects the browser to Google immediately —
  // no further code runs here.
});

// If already logged in, skip straight to dashboard
(async () => {
  const user = await getCurrentUser();
  if (user) window.location.href = 'dashboard.html';
})();
</script>

</body>
</html>
