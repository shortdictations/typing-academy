<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — TypeShala</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="letterhead">
  <div class="letterhead-inner">
    <a class="brand" href="index.html">
      <span class="seal">TS</span>
      <span class="brand-text">
        <span class="title">TypeShala</span>
        <span class="subtitle">Typing Practice Centre</span>
      </span>
    </a>
  </div>
</header>

<main class="page page-narrow">

  <div class="card">
    <a href="login.html" class="auth-back-link">&larr; Back</a>
    <h1 style="font-size:1.5rem; margin-bottom:18px;">Create Account</h1>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="registerForm">
      <div class="input-icon-field">
        <span class="field-icon" aria-hidden="true">&#128100;</span>
        <input type="text" id="regName" placeholder="Enter your name" required autocomplete="name">
      </div>
      <div class="input-icon-field">
        <span class="field-icon" aria-hidden="true">&#9993;</span>
        <input type="email" id="regEmail" placeholder="Enter your mail id" required autocomplete="email">
      </div>
      <div class="input-icon-field">
        <span class="field-icon" aria-hidden="true">&#128274;</span>
        <input type="password" id="regPassword" placeholder="Enter your password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-full" id="registerBtn" style="margin-top:4px;">Sign Up</button>
    </form>

    <p class="foot-link">
      Already have an account? <a href="login.html">Sign in</a>
    </p>
  </div>

</main>

<footer class="site-foot">TypeShala — built for typing practice, not affiliated with SSC or any government body.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
function hideMessages() {
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('successMsg').style.display = 'none';
}
function showError(text) {
  const el = document.getElementById('errorMsg');
  el.textContent = text;
  el.style.display = 'block';
  document.getElementById('successMsg').style.display = 'none';
}
function showSuccess(text) {
  const el = document.getElementById('successMsg');
  el.textContent = text;
  el.style.display = 'block';
  document.getElementById('errorMsg').style.display = 'none';
}

// Handle registration — no Confirm Password field/check anymore, per
// this redesign. Only the actual password is ever sent to Supabase.
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideMessages();

  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  btn.textContent = 'Creating account...';

  try {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    await registerStudent(name, email, password);
    showSuccess('Account created! Redirecting you to login...');
    document.getElementById('registerForm').reset();
    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
  } catch (err) {
    showError(err.message || 'Registration failed. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Sign Up';
  }
});

// If already logged in, skip straight to dashboard
(async () => {
  const user = await getCurrentUser();
  if (user) window.location.href = 'dashboard.html';
})();
</script>

</body>
</html>
